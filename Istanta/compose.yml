services:
  istanta:
    image: ${ISTANTA_IMAGE:?Set ISTANTA_IMAGE to the image reference from the release manifest}
    restart: unless-stopped
    ports:
      - "${ISTANTA_HTTP_PORT:-8080}:8080"
    env_file:
      - ${ISTANTA_ROOT:-/srv/istanta}/istanta.env
    environment:
      external_paths__pathLib: /app/external_lib/
    volumes:
      - type: bind
        source: ${ISTANTA_ROOT:-/srv/istanta}/external_lib
        target: /app/external_lib
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ISTANTA_ROOT:-/srv/istanta}/appsettings.json
        target: /app/appsettings.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${ISTANTA_ROOT:-/srv/istanta}/data
        target: /data
        bind:
          create_host_path: false
      - istanta-logs:/app/logs
      - istanta-keys:/home/app/.aspnet/DataProtection-Keys

volumes:
  istanta-logs:
  istanta-keys:
