# node_modules classico invece di Plug'n'Play: Nest, i moduli nativi e i
# percorsi letti a runtime si aspettano una cartella node_modules.
# Vale anche per ui/, che eredita questo file pur avendo il proprio yarn.lock.
nodeLinker: node-modules

# La versione di Yarn e' quella versionata qui: funziona anche senza Corepack.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Restano i default di sicurezza di Yarn 4: niente script di installazione dei
# pacchetti (sharp e ssh2 funzionano senza; ImageMagick e' quello dell'immagine,
# usato da riga di comando), nessuna dipendenza da repository git, versioni
# pubblicate da almeno un giorno.
