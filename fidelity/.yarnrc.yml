# node_modules classico invece di Plug'n'Play: tsx, vite, i binding nativi di
# rolldown e i percorsi letti a runtime si aspettano una cartella node_modules.
nodeLinker: node-modules

# La versione di Yarn e' quella versionata qui: funziona anche senza Corepack.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Restano i default di sicurezza di Yarn 4: niente script di installazione dei
# pacchetti (bcrypt, esbuild e gli altri nativi usano binari precompilati),
# nessuna dipendenza da repository git, versioni pubblicate da almeno un giorno.
