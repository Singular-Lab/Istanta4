<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FP Plugin - Esempio di utilizzo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2.5rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .controls {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 20px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #6c757d;
        }

        button.secondary:hover {
            background: #5a6268;
        }

        button.danger {
            background: #dc3545;
        }

        button.danger:hover {
            background: #c82333;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        #fp-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            min-height: 400px;
            overflow: hidden;
        }

        .status {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        .status-indicator.ready {
            background: #28a745;
        }

        .status-indicator.not-ready {
            background: #dc3545;
        }

        .log {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 200px;
            overflow-y: auto;
            margin-top: 15px;
        }

        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-entry .time {
            color: #6c757d;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 FP Plugin - Demo Interattiva</h1>

        <div class="status">
            <h3>
                <span class="status-indicator not-ready" id="status-indicator"></span>
                Stato: <span id="status-text">Non inizializzato</span>
            </h3>
            <div class="log" id="log"></div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="api-url">URL API</label>
                <input type="text" id="api-url" value="http://localhost:3010/api" placeholder="https://api.example.com">
            </div>

            <div class="control-group">
                <label for="mode">Modalità</label>
                <select id="mode">
                    <option value="refs-html">refs-html (Shadow DOM)</option>
                    <option value="refs">refs</option>
                    <option value="files">files</option>
                </select>
            </div>

            <div class="control-group">
                <label for="type">Tipo rendering</label>
                <select id="type">
                    <option value="grid">Grid</option>
                    <option value="carousel">Carousel</option>
                </select>
            </div>

            <div class="control-group">
                <label for="template-id">Template IDs (comma separated)</label>
                <input type="text" id="template-id" placeholder="template-123, template-456">
            </div>

            <div class="button-group">
                <button id="init-btn" onclick="initPlugin()">🎯 Inizializza Plugin</button>
                <button id="render-btn" onclick="renderContent()" disabled>🎨 Renderizza Contenuti</button>
                <button id="update-btn" onclick="updateOptions()" class="secondary" disabled>⚙️ Aggiorna Opzioni</button>
                <button id="reload-css-btn" onclick="reloadCss()" class="secondary" disabled>🔄 Reload CSS</button>
                <button id="destroy-btn" onclick="destroyPlugin()" class="danger" disabled>🗑️ Distruggi Plugin</button>
            </div>
        </div>

        <div id="fp-container"></div>
    </div>

    <script type="module">
        import FP from './dist/FP.esm.js';

        // Istanza globale del plugin
        let fp = null;

        // Logging utility
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="time">[${time}]</span><span>${message}</span>`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;

            console.log(`[FP Demo] ${message}`);
        }

        // Aggiorna stato UI
        function updateStatus(ready) {
            const indicator = document.getElementById('status-indicator');
            const statusText = document.getElementById('status-text');
            const renderBtn = document.getElementById('render-btn');
            const updateBtn = document.getElementById('update-btn');
            const reloadBtn = document.getElementById('reload-css-btn');
            const destroyBtn = document.getElementById('destroy-btn');
            const initBtn = document.getElementById('init-btn');

            if (ready) {
                indicator.className = 'status-indicator ready';
                statusText.textContent = 'Pronto';
                renderBtn.disabled = false;
                updateBtn.disabled = false;
                reloadBtn.disabled = false;
                destroyBtn.disabled = false;
                initBtn.disabled = true;
            } else {
                indicator.className = 'status-indicator not-ready';
                statusText.textContent = 'Non inizializzato';
                renderBtn.disabled = true;
                updateBtn.disabled = true;
                reloadBtn.disabled = true;
                destroyBtn.disabled = true;
                initBtn.disabled = false;
            }
        }

        // Inizializza plugin
        window.initPlugin = async function() {
            try {
                log('🚀 Creazione istanza FP...');
                fp = new FP();

                const apiUrl = document.getElementById('api-url').value;
                const mode = document.getElementById('mode').value;
                const type = document.getElementById('type').value;
                const templateIds = document.getElementById('template-id').value
                    .split(',')
                    .map(id => id.trim())
                    .filter(id => id);

                log(`⚙️ Inizializzazione con mode: ${mode}, type: ${type}`);

                const options = {
                    url: apiUrl,
                    container: document.getElementById('fp-container'),
                    type: type,
                    mode: mode
                };

                if (templateIds.length > 0 && (mode === 'refs' || mode === 'refs-html')) {
                    options.template_id = templateIds;
                    log(`📋 Template IDs: ${templateIds.join(', ')}`);
                }

                await fp.init(options);

                if (fp.isReady()) {
                    log('✅ Plugin inizializzato con successo!');
                    updateStatus(true);
                } else {
                    log('❌ Errore: Plugin non pronto', 'error');
                }
            } catch (error) {
                log(`❌ Errore inizializzazione: ${error.message}`, 'error');
                console.error(error);
            }
        };

        // Renderizza contenuti
        window.renderContent = async function() {
            if (!fp || !fp.isReady()) {
                log('⚠️ Plugin non inizializzato', 'warning');
                return;
            }

            try {
                log('🎨 Rendering contenuti...');
                await fp.render();
                log('✅ Contenuti renderizzati!');
            } catch (error) {
                log(`❌ Errore rendering: ${error.message}`, 'error');
                console.error(error);
            }
        };

        // Aggiorna opzioni
        window.updateOptions = function() {
            if (!fp || !fp.isReady()) {
                log('⚠️ Plugin non inizializzato', 'warning');
                return;
            }

            try {
                const templateIds = document.getElementById('template-id').value
                    .split(',')
                    .map(id => id.trim())
                    .filter(id => id);

                if (templateIds.length > 0) {
                    fp.setOptions({ template_id: templateIds });
                    log(`⚙️ Opzioni aggiornate - Templates: ${templateIds.join(', ')}`);
                } else {
                    log('⚠️ Nessun template ID specificato', 'warning');
                }
            } catch (error) {
                log(`❌ Errore aggiornamento: ${error.message}`, 'error');
                console.error(error);
            }
        };

        // Reload CSS
        window.reloadCss = async function() {
            if (!fp || !fp.isReady()) {
                log('⚠️ Plugin non inizializzato', 'warning');
                return;
            }

            try {
                log('🔄 Ricaricamento CSS...');
                await fp.reloadCss();
                log('✅ CSS ricaricato!');
            } catch (error) {
                log(`❌ Errore reload CSS: ${error.message}`, 'error');
                console.error(error);
            }
        };

        // Distruggi plugin
        window.destroyPlugin = function() {
            if (!fp) {
                log('⚠️ Nessuna istanza da distruggere', 'warning');
                return;
            }

            try {
                log('🗑️ Distruzione plugin...');
                fp.destroy();
                fp = null;
                log('✅ Plugin distrutto!');
                updateStatus(false);
            } catch (error) {
                log(`❌ Errore distruzione: ${error.message}`, 'error');
                console.error(error);
            }
        };

        // Log iniziale
        log('👋 Demo pronta! Clicca "Inizializza Plugin" per iniziare.');
    </script>
</body>
</html>
