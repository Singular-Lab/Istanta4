name: Build and publish Istanta
run-name: Istanta ${{ inputs.version }} - release ${{ inputs.releaseID }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versione senza prefisso v (es. 3.5.12)'
        required: true
        type: string
      releaseID:
        description: 'Identificativo della release nel sistema chiamante'
        required: true
        type: string
      sourceSHA:
        description: 'SHA completo (40 caratteri) del commit da compilare'
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: istanta-docker-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish-container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo '::error::Container images can only be published from main.'
            exit 1
          fi

      - name: Validate inputs and prepare image name
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.releaseID }}
          SOURCE_SHA: ${{ inputs.sourceSHA }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || (( ${#VERSION} > 128 )); then
            echo '::error::version must have format X.Y.Z or X.Y.Z-prerelease, without a v prefix (max 128 characters).'
            exit 1
          fi
          if [[ ! "$RELEASE_ID" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo '::error::releaseID must contain 1-128 letters, digits, underscores, dots or hyphens.'
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[a-fA-F0-9]{40}$ ]]; then
            echo '::error::sourceSHA must be a full 40-character Git commit SHA.'
            exit 1
          fi
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/istanta" >> "$GITHUB_OUTPUT"
          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Checkout requested source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.metadata.outputs.sha }}
          persist-credentials: false

      - name: Verify source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f Istanta/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Istanta/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:${{ inputs.version }}
            ${{ steps.metadata.outputs.image }}:latest
            ${{ steps.metadata.outputs.image }}:sha-${{ steps.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Istanta
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            company.ai.release.id=${{ inputs.releaseID }}
          cache-from: type=gha,scope=istanta
          cache-to: type=gha,mode=max,scope=istanta

      - name: Create release manifest
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.releaseID }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ steps.metadata.outputs.sha }}
          IMAGE_NAME: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo '::error::Missing or invalid published image digest.'
            exit 1
          fi
          jq -n \
            --arg releaseId "$RELEASE_ID" \
            --arg version "$RELEASE_VERSION" \
            --arg image "$IMAGE_NAME" \
            --arg digest "$IMAGE_DIGEST" \
            --arg imageReference "$IMAGE_NAME@$IMAGE_DIGEST" \
            --arg sourceCommit "$SOURCE_COMMIT" \
            '{
              releaseId: $releaseId,
              version: $version,
              image: $image,
              digest: $digest,
              imageReference: $imageReference,
              sourceCommit: $sourceCommit
            }' > "$RUNNER_TEMP/release-manifest.json"

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ inputs.releaseID }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Write release summary
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.releaseID }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          {
            printf '### Istanta pubblicata\n\n'
            printf -- '- Immagine: `%s:%s`\n' "$IMAGE" "$VERSION"
            printf -- '- Release ID: `%s`\n' "$RELEASE_ID"
            printf -- '- Commit: `%s`\n' "$SOURCE_SHA"
            printf -- '- Riferimento immutabile: `%s@%s`\n' "$IMAGE" "$DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
