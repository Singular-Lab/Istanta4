name: Build and publish Istanta suite
run-name: Istanta suite ${{ inputs.version }} - release ${{ inputs.release_id }}

on:
  workflow_dispatch:
    inputs:
      version: { description: Versione semantica senza prefisso v, required: true, type: string }
      release_id: { description: Identificativo release ControlPlane, required: true, type: string }
      source_sha: { description: SHA completo del commit da compilare, required: true, type: string }
      components_json: { description: Configurazione componenti fornita da ControlPlane, required: true, type: string }
      previous_source_sha: { description: SHA della precedente release, required: false, default: '', type: string }
      previous_artifacts_json: { description: Artefatti della precedente release, required: false, default: '', type: string }

permissions:
  contents: read
  packages: write

concurrency:
  group: istanta-suite-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate release inputs
        id: metadata
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ inputs.release_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          COMPONENTS_JSON: ${{ inputs.components_json }}
          PREVIOUS_SOURCE_SHA: ${{ inputs.previous_source_sha }}
          PREVIOUS_ARTIFACTS_JSON: ${{ inputs.previous_artifacts_json }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/main ]] || { echo '::error::Dispatch must use main.'; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo '::error::Invalid version.'; exit 1; }
          [[ "$RELEASE_ID" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]] || { echo '::error::Invalid release_id.'; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo '::error::Invalid source_sha.'; exit 1; }

          component_path() {
            local key="$1" field="$2" root value
            root=$(printf '%s' "$COMPONENTS_JSON" | jq -er --arg key "$key" \
              '.[] | select(.key == $key) | .relativePath')
            value=$(printf '%s' "$COMPONENTS_JSON" | jq -er --arg key "$key" --arg field "$field" \
              '.[] | select(.key == $key) | .[$field]')
            if [[ "$value" == "." ]]; then
              printf '%s' "${root%/}"
            else
              printf '%s/%s' "${root%/}" "${value#./}"
            fi
          }

          printf '%s' "$COMPONENTS_JSON" | jq -e '
            length == 5 and
            ([.[].key] | unique | length) == 5 and
            any(.[]; .key == "istanta" and .artifactKind == "ContainerImage") and
            any(.[]; .key == "agenzia-lib" and .artifactKind == "File" and .artifactFileName == "AgenziaLib.dll") and
            any(.[]; .key == "fidelity" and .artifactKind == "ContainerImage") and
            any(.[]; .key == "olimpo" and .artifactKind == "ContainerImage") and
            any(.[]; .key == "correggo" and .artifactKind == "ContainerImage")
          ' >/dev/null
          istanta_image=$(printf '%s' "$COMPONENTS_JSON" | jq -er '.[] | select(.key == "istanta") | .imageName')
          agenzialib_repository=$(printf '%s' "$COMPONENTS_JSON" | jq -er '.[] | select(.key == "agenzia-lib") | .imageName')
          fidelity_image=$(printf '%s' "$COMPONENTS_JSON" | jq -er '.[] | select(.key == "fidelity") | .imageName')
          olimpo_image=$(printf '%s' "$COMPONENTS_JSON" | jq -er '.[] | select(.key == "olimpo") | .imageName')
          correggo4_image=$(printf '%s' "$COMPONENTS_JSON" | jq -er '.[] | select(.key == "correggo") | .imageName')
          fidelity_context=$(component_path fidelity buildContext)
          fidelity_dockerfile=$(component_path fidelity dockerfilePath)
          olimpo_context=$(component_path olimpo buildContext)
          olimpo_dockerfile=$(component_path olimpo dockerfilePath)
          correggo4_context=$(component_path correggo buildContext)
          correggo4_dockerfile=$(component_path correggo dockerfilePath)
          for image in "$istanta_image" "$agenzialib_repository" "$fidelity_image" "$olimpo_image" "$correggo4_image"; do
            [[ "$image" =~ ^ghcr\.io/[a-z0-9._/-]+$ ]] || { echo "::error::Invalid OCI repository $image"; exit 1; }
          done

          has_previous=false
          if [[ -n "$PREVIOUS_SOURCE_SHA" || -n "$PREVIOUS_ARTIFACTS_JSON" ]]; then
            [[ "$PREVIOUS_SOURCE_SHA" =~ ^[a-fA-F0-9]{40}$ ]] || { echo '::error::Invalid previous_source_sha.'; exit 1; }
            printf '%s' "$PREVIOUS_ARTIFACTS_JSON" | jq -e '
              length == 5 and
              any(.[]; .component == "istanta" and .artifactKind == "ContainerImage") and
              any(.[]; .component == "agenzia-lib" and .artifactKind == "File") and
              any(.[]; .component == "fidelity" and .artifactKind == "ContainerImage") and
              any(.[]; .component == "olimpo" and .artifactKind == "ContainerImage") and
              any(.[]; .component == "correggo" and .artifactKind == "ContainerImage") and
              all(.[]; (.digest | test("^sha256:[a-f0-9]{64}$")) and .imageReference == (.image + "@" + .digest))
            ' >/dev/null
            has_previous=true
          fi
          echo "sha=${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "previous_sha=${PREVIOUS_SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"
          echo "has_previous=$has_previous" >> "$GITHUB_OUTPUT"
          echo "istanta_image=$istanta_image" >> "$GITHUB_OUTPUT"
          echo "agenzialib_repository=$agenzialib_repository" >> "$GITHUB_OUTPUT"
          echo "fidelity_image=$fidelity_image" >> "$GITHUB_OUTPUT"
          echo "olimpo_image=$olimpo_image" >> "$GITHUB_OUTPUT"
          echo "correggo4_image=$correggo4_image" >> "$GITHUB_OUTPUT"
          echo "fidelity_context=$fidelity_context" >> "$GITHUB_OUTPUT"
          echo "fidelity_dockerfile=$fidelity_dockerfile" >> "$GITHUB_OUTPUT"
          echo "olimpo_context=$olimpo_context" >> "$GITHUB_OUTPUT"
          echo "olimpo_dockerfile=$olimpo_dockerfile" >> "$GITHUB_OUTPUT"
          echo "correggo4_context=$correggo4_context" >> "$GITHUB_OUTPUT"
          echo "correggo4_dockerfile=$correggo4_dockerfile" >> "$GITHUB_OUTPUT"

      - name: Checkout requested source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          FIDELITY_CONTEXT: ${{ steps.metadata.outputs.fidelity_context }}
          FIDELITY_DOCKERFILE: ${{ steps.metadata.outputs.fidelity_dockerfile }}
          OLIMPO_CONTEXT: ${{ steps.metadata.outputs.olimpo_context }}
          OLIMPO_DOCKERFILE: ${{ steps.metadata.outputs.olimpo_dockerfile }}
          CORREGGO4_CONTEXT: ${{ steps.metadata.outputs.correggo4_context }}
          CORREGGO4_DOCKERFILE: ${{ steps.metadata.outputs.correggo4_dockerfile }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f Istanta/Dockerfile
          test -f AgenziaLib/AgenziaLib.csproj
          test -d "$FIDELITY_CONTEXT"
          test -f "$FIDELITY_DOCKERFILE"
          test -d "$OLIMPO_CONTEXT"
          test -f "$OLIMPO_DOCKERFILE"
          test -d "$CORREGGO4_CONTEXT"
          test -f "$CORREGGO4_DOCKERFILE"

      - name: Detect affected components
        id: changes
        shell: bash
        env:
          COMPONENTS_JSON: ${{ inputs.components_json }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          PREVIOUS_SOURCE_SHA: ${{ steps.metadata.outputs.previous_sha }}
          HAS_PREVIOUS: ${{ steps.metadata.outputs.has_previous }}
        run: |
          set -euo pipefail
          declare -A build
          mapfile -t keys < <(printf '%s' "$COMPONENTS_JSON" | jq -r '.[].key')
          if [[ "$HAS_PREVIOUS" != true ]] || ! git cat-file -e "$PREVIOUS_SOURCE_SHA^{commit}"; then
            for key in "${keys[@]}"; do build[$key]=true; done
          else
            mapfile -t changed_files < <(git diff --name-only "$PREVIOUS_SOURCE_SHA" "$SOURCE_SHA")
            printf '%s\n' "${changed_files[@]}" > "$RUNNER_TEMP/changed-files.txt"
            for key in "${keys[@]}"; do
              build[$key]=false
              mapfile -t paths < <(printf '%s' "$COMPONENTS_JSON" | jq -r --arg key "$key" '.[] | select(.key == $key) | (.changePaths // [])[]')
              if [[ ${#paths[@]} -eq 0 ]]; then
                build[$key]=true
                continue
              fi
              for file in "${changed_files[@]}"; do
                for prefix in "${paths[@]}"; do
                  prefix=${prefix%/}
                  if [[ "$file" == "$prefix" || "$file" == "$prefix/"* ]]; then build[$key]=true; fi
                done
              done
            done
            updated=true
            while [[ "$updated" == true ]]; do
              updated=false
              for key in "${keys[@]}"; do
                [[ "${build[$key]}" == true ]] && continue
                mapfile -t dependencies < <(printf '%s' "$COMPONENTS_JSON" | jq -r --arg key "$key" '.[] | select(.key == $key) | (.dependsOn // [])[]')
                for dependency in "${dependencies[@]}"; do
                  if [[ "${build[$dependency]:-false}" == true ]]; then build[$key]=true; updated=true; fi
                done
              done
            done
          fi
          echo "istanta=${build[istanta]:-true}" >> "$GITHUB_OUTPUT"
          echo "agenzialib=${build[agenzia-lib]:-true}" >> "$GITHUB_OUTPUT"
          echo "fidelity=${build[fidelity]:-true}" >> "$GITHUB_OUTPUT"
          echo "olimpo=${build[olimpo]:-true}" >> "$GITHUB_OUTPUT"
          echo "correggo4=${build[correggo]:-true}" >> "$GITHUB_OUTPUT"
          printf '### Componenti interessati\n\n- Istanta: `%s`\n- AgenziaLib: `%s`\n- Fidelity: `%s`\n- Olimpo: `%s`\n- Correggo4: `%s`\n' \
            "${build[istanta]:-true}" "${build[agenzia-lib]:-true}" "${build[fidelity]:-true}" \
            "${build[olimpo]:-true}" "${build[correggo]:-true}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        if: steps.changes.outputs.istanta == 'true' || steps.changes.outputs.agenzialib == 'true' || steps.changes.outputs.fidelity == 'true' || steps.changes.outputs.olimpo == 'true' || steps.changes.outputs.correggo4 == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.changes.outputs.istanta == 'true' || steps.changes.outputs.agenzialib == 'true' || steps.changes.outputs.fidelity == 'true' || steps.changes.outputs.olimpo == 'true' || steps.changes.outputs.correggo4 == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Istanta image
        if: steps.changes.outputs.istanta == 'true'
        id: istanta
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Istanta/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.istanta_image }}:${{ inputs.version }}
            ${{ steps.metadata.outputs.istanta_image }}:latest
            ${{ steps.metadata.outputs.istanta_image }}:sha-${{ steps.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Istanta
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            company.ai.release.id=${{ inputs.release_id }}
          cache-from: type=gha,scope=istanta
          cache-to: type=gha,mode=max,scope=istanta

      - name: Export AgenziaLib.dll
        if: steps.changes.outputs.agenzialib == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Istanta/Dockerfile
          target: agenzialib-export
          platforms: linux/amd64
          push: false
          outputs: type=local,dest=${{ runner.temp }}/agenzialib
          cache-from: type=gha,scope=agenzialib
          cache-to: type=gha,mode=max,scope=agenzialib

      - name: Set up ORAS
        if: steps.changes.outputs.agenzialib == 'true'
        uses: oras-project/setup-oras@v1

      - name: Publish AgenziaLib.dll as OCI artifact
        if: steps.changes.outputs.agenzialib == 'true'
        id: agenzialib
        shell: bash
        env:
          REGISTRY_REPOSITORY: ${{ steps.metadata.outputs.agenzialib_repository }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          cd "$RUNNER_TEMP/agenzialib"
          test -f AgenziaLib.dll
          file_sha256=$(sha256sum AgenziaLib.dll); file_sha256=${file_sha256%% *}
          oras push "$REGISTRY_REPOSITORY:$VERSION,sha-$SOURCE_SHA,latest" \
            --artifact-type application/vnd.company.ai.dotnet-assembly.v1 \
            "AgenziaLib.dll:application/vnd.microsoft.portable-executable" \
            --annotation "org.opencontainers.image.version=$VERSION" \
            --annotation "org.opencontainers.image.revision=$SOURCE_SHA" \
            --format json > "$RUNNER_TEMP/agenzialib-oci.json"
          digest=$(jq -er '.digest' "$RUNNER_TEMP/agenzialib-oci.json")
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "file_sha256=$file_sha256" >> "$GITHUB_OUTPUT"

      - name: Build and push Fidelity image
        if: steps.changes.outputs.fidelity == 'true'
        id: fidelity
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.metadata.outputs.fidelity_context }}
          file: ${{ steps.metadata.outputs.fidelity_dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=/api
            VITE_WS_URL=/
          tags: |
            ${{ steps.metadata.outputs.fidelity_image }}:${{ inputs.version }}
            ${{ steps.metadata.outputs.fidelity_image }}:latest
            ${{ steps.metadata.outputs.fidelity_image }}:sha-${{ steps.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Fidelity
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            company.ai.release.id=${{ inputs.release_id }}
          cache-from: type=gha,scope=fidelity
          cache-to: type=gha,mode=max,scope=fidelity

      - name: Build and push Olimpo image
        if: steps.changes.outputs.olimpo == 'true'
        id: olimpo
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.metadata.outputs.olimpo_context }}
          file: ${{ steps.metadata.outputs.olimpo_dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.olimpo_image }}:${{ inputs.version }}
            ${{ steps.metadata.outputs.olimpo_image }}:latest
            ${{ steps.metadata.outputs.olimpo_image }}:sha-${{ steps.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Olimpo
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            company.ai.release.id=${{ inputs.release_id }}
          cache-from: type=gha,scope=olimpo
          cache-to: type=gha,mode=max,scope=olimpo

      - name: Build and push Correggo4 image
        if: steps.changes.outputs.correggo4 == 'true'
        id: correggo4
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.metadata.outputs.correggo4_context }}
          file: ${{ steps.metadata.outputs.correggo4_dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.metadata.outputs.correggo4_image }}:${{ inputs.version }}
            ${{ steps.metadata.outputs.correggo4_image }}:latest
            ${{ steps.metadata.outputs.correggo4_image }}:sha-${{ steps.metadata.outputs.sha }}
          labels: |
            org.opencontainers.image.title=Correggo4
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            company.ai.release.id=${{ inputs.release_id }}
          cache-from: type=gha,scope=correggo4
          cache-to: type=gha,mode=max,scope=correggo4

      - name: Create ControlPlane release manifest v2
        shell: bash
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
          PREVIOUS_ARTIFACTS_JSON: ${{ inputs.previous_artifacts_json }}
          ISTANTA_BUILT: ${{ steps.changes.outputs.istanta }}
          ISTANTA_IMAGE: ${{ steps.metadata.outputs.istanta_image }}
          ISTANTA_NEW_DIGEST: ${{ steps.istanta.outputs.digest }}
          AGENZIALIB_BUILT: ${{ steps.changes.outputs.agenzialib }}
          AGENZIALIB_REPOSITORY: ${{ steps.metadata.outputs.agenzialib_repository }}
          AGENZIALIB_NEW_DIGEST: ${{ steps.agenzialib.outputs.digest }}
          AGENZIALIB_NEW_FILE_SHA256: ${{ steps.agenzialib.outputs.file_sha256 }}
          FIDELITY_BUILT: ${{ steps.changes.outputs.fidelity }}
          FIDELITY_IMAGE: ${{ steps.metadata.outputs.fidelity_image }}
          FIDELITY_NEW_DIGEST: ${{ steps.fidelity.outputs.digest }}
          OLIMPO_BUILT: ${{ steps.changes.outputs.olimpo }}
          OLIMPO_IMAGE: ${{ steps.metadata.outputs.olimpo_image }}
          OLIMPO_NEW_DIGEST: ${{ steps.olimpo.outputs.digest }}
          CORREGGO4_BUILT: ${{ steps.changes.outputs.correggo4 }}
          CORREGGO4_IMAGE: ${{ steps.metadata.outputs.correggo4_image }}
          CORREGGO4_NEW_DIGEST: ${{ steps.correggo4.outputs.digest }}
        run: |
          set -euo pipefail

          image_digest() {
            local component="$1" built="$2" new_digest="$3"
            if [[ "$built" == true ]]; then
              printf '%s' "$new_digest"
            else
              printf '%s' "$PREVIOUS_ARTIFACTS_JSON" | jq -er --arg component "$component" \
                '.[] | select(.component == $component) | .digest'
            fi
          }

          istanta_digest=$(image_digest istanta "$ISTANTA_BUILT" "$ISTANTA_NEW_DIGEST")
          fidelity_digest=$(image_digest fidelity "$FIDELITY_BUILT" "$FIDELITY_NEW_DIGEST")
          olimpo_digest=$(image_digest olimpo "$OLIMPO_BUILT" "$OLIMPO_NEW_DIGEST")
          correggo4_digest=$(image_digest correggo "$CORREGGO4_BUILT" "$CORREGGO4_NEW_DIGEST")
          if [[ "$AGENZIALIB_BUILT" == true ]]; then
            agenzialib_digest="$AGENZIALIB_NEW_DIGEST"
            agenzialib_file_sha="$AGENZIALIB_NEW_FILE_SHA256"
          else
            agenzialib_digest=$(printf '%s' "$PREVIOUS_ARTIFACTS_JSON" | jq -er '.[] | select(.component == "agenzia-lib") | .digest')
            agenzialib_file_sha=$(printf '%s' "$PREVIOUS_ARTIFACTS_JSON" | jq -er '.[] | select(.component == "agenzia-lib") | .fileSha256')
          fi
          for digest in "$istanta_digest" "$agenzialib_digest" "$fidelity_digest" "$olimpo_digest" "$correggo4_digest"; do
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Invalid component digest"; exit 1; }
          done
          [[ "$agenzialib_file_sha" =~ ^[a-f0-9]{64}$ ]] || exit 1
          jq -n \
            --arg releaseId "$RELEASE_ID" --arg version "$VERSION" --arg sourceCommit "$SOURCE_SHA" \
            --arg istantaImage "$ISTANTA_IMAGE" --arg istantaDigest "$istanta_digest" --argjson istantaBuilt "$ISTANTA_BUILT" \
            --arg agenziaImage "$AGENZIALIB_REPOSITORY" --arg agenziaDigest "$agenzialib_digest" \
            --arg agenziaFileSha "$agenzialib_file_sha" --argjson agenziaBuilt "$AGENZIALIB_BUILT" \
            --arg fidelityImage "$FIDELITY_IMAGE" --arg fidelityDigest "$fidelity_digest" --argjson fidelityBuilt "$FIDELITY_BUILT" \
            --arg olimpoImage "$OLIMPO_IMAGE" --arg olimpoDigest "$olimpo_digest" --argjson olimpoBuilt "$OLIMPO_BUILT" \
            --arg correggo4Image "$CORREGGO4_IMAGE" --arg correggo4Digest "$correggo4_digest" --argjson correggo4Built "$CORREGGO4_BUILT" \
            '{schemaVersion: 2, releaseId: $releaseId, version: $version, sourceCommit: $sourceCommit,
              artifacts: [
                {component: "istanta", artifactKind: "ContainerImage", image: $istantaImage,
                 digest: $istantaDigest, imageReference: ($istantaImage + "@" + $istantaDigest), builtForThisRelease: $istantaBuilt},
                {component: "agenzia-lib", artifactKind: "File", image: $agenziaImage,
                 digest: $agenziaDigest, imageReference: ($agenziaImage + "@" + $agenziaDigest),
                 fileName: "AgenziaLib.dll", fileSha256: $agenziaFileSha, builtForThisRelease: $agenziaBuilt},
                {component: "fidelity", artifactKind: "ContainerImage", image: $fidelityImage,
                 digest: $fidelityDigest, imageReference: ($fidelityImage + "@" + $fidelityDigest), builtForThisRelease: $fidelityBuilt},
                {component: "olimpo", artifactKind: "ContainerImage", image: $olimpoImage,
                 digest: $olimpoDigest, imageReference: ($olimpoImage + "@" + $olimpoDigest), builtForThisRelease: $olimpoBuilt},
                {component: "correggo", artifactKind: "ContainerImage", image: $correggo4Image,
                 digest: $correggo4Digest, imageReference: ($correggo4Image + "@" + $correggo4Digest), builtForThisRelease: $correggo4Built}
              ]}' > "$RUNNER_TEMP/release-manifest.json"

      - name: Upload ControlPlane release manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ inputs.release_id }}
          path: ${{ runner.temp }}/release-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Write release summary
        shell: bash
        run: |
          printf '\n### Istanta suite pubblicata\n\n- Istanta ricostruita: `%s`\n- AgenziaLib ricostruita: `%s`\n- Fidelity ricostruita: `%s`\n- Olimpo ricostruita: `%s`\n- Correggo4 ricostruita: `%s`\n- Release ID: `%s`\n' \
            '${{ steps.changes.outputs.istanta }}' '${{ steps.changes.outputs.agenzialib }}' \
            '${{ steps.changes.outputs.fidelity }}' '${{ steps.changes.outputs.olimpo }}' \
            '${{ steps.changes.outputs.correggo4 }}' '${{ inputs.release_id }}' >> "$GITHUB_STEP_SUMMARY"
