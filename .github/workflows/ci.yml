name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: verification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect affected components
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          istanta=false
          agenzialib=false
          fidelity=false
          olimpo=false
          correggo4=false
          plugin=false

          mark_all() {
            istanta=true
            agenzialib=true
            fidelity=true
            olimpo=true
            correggo4=true
            plugin=true
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]] \
            || [[ -z "$BASE_SHA" ]] \
            || [[ "$BASE_SHA" =~ ^0+$ ]] \
            || ! git cat-file -e "$BASE_SHA^{commit}"; then
            mark_all
            printf '%s\n' 'Full verification requested.' > "$RUNNER_TEMP/changed-files.txt"
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

            while IFS= read -r file; do
              case "$file" in
                Istanta/*)
                  istanta=true
                  ;;
                IstantaLib/*)
                  istanta=true
                  agenzialib=true
                  ;;
                AgenziaLib/*)
                  agenzialib=true
                  ;;
                tests/plugin/*)
                  # I test del Plugin girano con Node e verificano solo il Plugin:
                  # non devono far partire la build e i test .NET.
                  plugin=true
                  ;;
                tests/*)
                  # La suite di test .NET copre Istanta e AgenziaLib: sono quelli
                  # da verificare, non l'intera suite.
                  istanta=true
                  agenzialib=true
                  ;;
                fidelity/*)
                  fidelity=true
                  ;;
                olimpo/*)
                  olimpo=true
                  ;;
                correggo4/*)
                  correggo4=true
                  ;;
                plugin/*)
                  plugin=true
                  ;;
                .github/workflows/*|global.json|Directory.Build.*|Directory.Packages.props|NuGet.Config)
                  mark_all
                  ;;
                AGENTS.md|*/AGENTS.md|*.md|docs/*|artifacts/*)
                  ;;
                *)
                  # Un file condiviso o non ancora classificato potrebbe influire
                  # su qualunque componente: scegli la verifica conservativa.
                  mark_all
                  ;;
              esac
            done < "$RUNNER_TEMP/changed-files.txt"
          fi

          {
            echo "istanta=$istanta"
            echo "agenzialib=$agenzialib"
            echo "fidelity=$fidelity"
            echo "olimpo=$olimpo"
            echo "correggo4=$correggo4"
            echo "plugin=$plugin"
          } >> "$GITHUB_OUTPUT"

          {
            printf '### Componenti verificati\n\n'
            printf -- '- Istanta: `%s`\n' "$istanta"
            printf -- '- AgenziaLib: `%s`\n' "$agenzialib"
            printf -- '- Fidelity: `%s`\n' "$fidelity"
            printf -- '- Olimpo: `%s`\n' "$olimpo"
            printf -- '- Correggo4: `%s`\n' "$correggo4"
            printf -- '- Plugin: `%s`\n\n' "$plugin"
            printf '<details><summary>File modificati</summary>\n\n```text\n'
            cat "$RUNNER_TEMP/changed-files.txt"
            printf '```\n</details>\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up .NET
        if: steps.changes.outputs.istanta == 'true' || steps.changes.outputs.agenzialib == 'true' || steps.changes.outputs.correggo4 == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build Istanta
        if: steps.changes.outputs.istanta == 'true'
        run: dotnet build Istanta/Istanta.csproj -c Release

      - name: Build AgenziaLib
        if: steps.changes.outputs.agenzialib == 'true'
        run: dotnet build AgenziaLib/AgenziaLib.csproj -c Release

      # Il progetto di test puo' non essere presente sul ref in verifica: in quel
      # caso lo step viene saltato invece di fallire con MSB1009.
      - name: Test suite .NET
        if: (steps.changes.outputs.istanta == 'true' || steps.changes.outputs.agenzialib == 'true') && hashFiles('tests/Istanta.Suite.Tests/Istanta.Suite.Tests.csproj') != ''
        run: dotnet test tests/Istanta.Suite.Tests/Istanta.Suite.Tests.csproj -c Release

      - name: Build Correggo4
        if: steps.changes.outputs.correggo4 == 'true'
        run: dotnet build correggo4/app/Correggo4/Correggo4.csproj -c Release

      # Fidelity e Olimpo usano Yarn 4: il `yarn` del runner passa da solo alla
      # versione versionata in .yarn/releases (yarnPath in .yarnrc.yml).
      - name: Set up Node.js for Fidelity
        if: steps.changes.outputs.fidelity == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: yarn
          cache-dependency-path: fidelity/yarn.lock

      # --immutable: la CI fallisce se yarn.lock non corrisponde ai package.json.
      - name: Install Fidelity dependencies
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn install --immutable

      # I tipi di Express sono fissati da "resolutions" in fidelity/package.json.
      - name: Inspect Fidelity Express types
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn why @types/express && yarn why @types/express-serve-static-core

      - name: Type-check Fidelity client
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn type-check

      - name: Type-check Fidelity server
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn type-check:server

      - name: Lint Fidelity client
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn lint

      # Solo le dipendenze di runtime: una vulnerabilita' alta o critica blocca la CI.
      # I pacchetti deprecati non sono vulnerabilita' e non la bloccano.
      - name: Audit Fidelity dependencies
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn npm audit --all --recursive --environment production --severity high --no-deprecations

      - name: Test Fidelity
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn test:server

      - name: Build Fidelity
        if: steps.changes.outputs.fidelity == 'true'
        working-directory: fidelity
        run: yarn build

      - name: Set up Node.js for Olimpo
        if: steps.changes.outputs.olimpo == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: |
            olimpo/yarn.lock
            olimpo/ui/yarn.lock

      - name: Install Olimpo dependencies
        if: steps.changes.outputs.olimpo == 'true'
        working-directory: olimpo
        run: yarn install --immutable

      - name: Test Olimpo
        if: steps.changes.outputs.olimpo == 'true'
        working-directory: olimpo
        run: yarn test --runInBand

      # build installa anche ui/ dal suo yarn.lock, con --immutable.
      - name: Build Olimpo
        if: steps.changes.outputs.olimpo == 'true'
        working-directory: olimpo
        run: yarn build

      - name: Validate Plugin manifest
        if: steps.changes.outputs.plugin == 'true'
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            (.id | type == "string" and length > 0) and
            (.name | type == "string" and length > 0) and
            (.version | type == "string" and length > 0)
          ' plugin/manifest.json > /dev/null

      - name: Set up Node.js for Plugin
        if: steps.changes.outputs.plugin == 'true' && hashFiles('tests/plugin/*.test.js') != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # I moduli del Plugin che non dipendono da UXP/InDesign sono verificati con il
      # test runner di Node: la suite non richiede dipendenze ne' package.json.
      - name: Test suite Plugin
        if: steps.changes.outputs.plugin == 'true' && hashFiles('tests/plugin/*.test.js') != ''
        run: node --test tests/plugin/*.test.js

      # Gli script della web app che non dipendono dal browser (wwwroot/js con export
      # condizionato per Node) hanno la loro suite, con lo stesso runner e nessuna dipendenza.
      - name: Set up Node.js for Istanta web
        if: steps.changes.outputs.istanta == 'true' && hashFiles('tests/istanta-web/*.test.js') != ''
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test suite Istanta web
        if: steps.changes.outputs.istanta == 'true' && hashFiles('tests/istanta-web/*.test.js') != ''
        run: node --test tests/istanta-web/*.test.js

      - name: Set up Docker Buildx
        if: steps.changes.outputs.istanta == 'true' || steps.changes.outputs.agenzialib == 'true' || steps.changes.outputs.fidelity == 'true' || steps.changes.outputs.olimpo == 'true' || steps.changes.outputs.correggo4 == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Validate Istanta production image
        if: steps.changes.outputs.istanta == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Istanta/Dockerfile
          target: final
          push: false
          cache-from: type=gha,scope=ci-istanta
          cache-to: type=gha,mode=max,scope=ci-istanta

      - name: Validate AgenziaLib artifact
        if: steps.changes.outputs.agenzialib == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Istanta/Dockerfile
          target: agenzialib-export
          push: false
          cache-from: type=gha,scope=ci-agenzialib
          cache-to: type=gha,mode=max,scope=ci-agenzialib

      - name: Validate Fidelity production image
        if: steps.changes.outputs.fidelity == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./fidelity
          file: ./fidelity/docker/server.prod.Dockerfile
          push: false
          cache-from: type=gha,scope=ci-fidelity
          cache-to: type=gha,mode=max,scope=ci-fidelity

      - name: Validate Olimpo production image
        if: steps.changes.outputs.olimpo == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./olimpo
          file: ./olimpo/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-olimpo
          cache-to: type=gha,mode=max,scope=ci-olimpo

      - name: Validate Correggo4 production image
        if: steps.changes.outputs.correggo4 == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./correggo4
          file: ./correggo4/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-correggo4
          cache-to: type=gha,mode=max,scope=ci-correggo4
